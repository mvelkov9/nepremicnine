[project]
name = "nepremicnine-backend"
version = "0.17.0"
description = "Slovenian real estate price analysis & prediction API"
requires-python = ">=3.13"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.18",

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.14.0",
    "greenlet>=3.1.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.0",

    # Validation & settings
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "email-validator>=2.2.0",

    # Task queue
    "arq>=0.26.1",

    # ML / Data
    "scikit-learn>=1.6.0",
    "catboost>=1.2.8",
    "pandas>=2.2.0",
    "numpy>=2.1.0",
    "joblib>=1.4.0",
    "geopandas>=1.0.1",
    "shapely>=2.0.6",
    "pyogrio>=0.10.0",

    # Rate limiting
    "slowapi>=0.1.9",

    # Monitoring
    "prometheus-fastapi-instrumentator>=7.0.0",

    # Utils
    "httpx>=0.28.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "aiosqlite>=0.20.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["app/tasks/*"]

[tool.coverage.report]
fail_under = 60

[tool.ruff]
target-version = "py313"
line-length = 120
cache-dir = "~/.cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
