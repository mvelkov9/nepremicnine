# docker-compose.prod.yml — Production overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This removes dev volume mounts, uses built images, runs as non-root,
# and serves the frontend via nginx (not Vite dev server).

services:
  postgres:
    ports: !reset []
    # Don't expose Postgres externally in production

  redis:
    ports: !reset []
    # Don't expose Redis externally in production

  backend:
    # Remove dev overrides: no source mount, no reload, run as appuser
    user: appuser
    # 2 workers: ~1.8GB each at steady state fits within 7.6GB host RAM, and
    # parallelizes concurrent dashboard requests (8+ endpoints fan-out per page).
    # Single worker caused 25-39s tail latency from request queueing.
    # The Dokazi benchmark rebuild (~1GB peak) only runs on cache miss and is
    # serialized through one worker at a time, so OOM risk is minimal.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    volumes: !override
      - backend-data:/app/data
      - backend-models:/app/models
    ports: !override
      - "${BACKEND_BIND_IP:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    environment:
      APP_ENV: production

  worker:
    user: appuser
    healthcheck:
      disable: true
    volumes: !override
      - backend-data:/app/data
      - backend-models:/app/models
    environment:
      APP_ENV: production

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # No target override — uses full multi-stage (builder → nginx)
    command: !reset []
    volumes: !reset []
    ports: !override
      - "${FRONTEND_PORT:-80}:80"

volumes:
  backend-data:
