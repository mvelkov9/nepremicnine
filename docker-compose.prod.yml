# docker-compose.prod.yml — Production overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This removes dev volume mounts, uses built images, runs as non-root,
# and serves the frontend via Nuxt/Nitro.

services:
  postgres:
    ports: !reset []
    # Don't expose Postgres externally in production

  redis:
    ports: !reset []
    # Don't expose Redis externally in production

  backend:
    # Remove dev overrides: no source mount, no reload, run as appuser
    user: appuser
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    volumes: !override
      - backend-data:/app/data
      - backend-models:/app/models
    ports: !override
      - "${BACKEND_BIND_IP:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    environment:
      APP_ENV: production

  worker:
    user: appuser
    healthcheck:
      disable: true
    volumes: !override
      - backend-data:/app/data
      - backend-models:/app/models
    environment:
      APP_ENV: production

  frontend:
    profiles: !reset []
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
    command: !reset []
    volumes: !reset []
    environment:
      BACKEND_URL: http://backend:8000
      NUXT_BACKEND_URL: http://backend:8000
      APP_VERSION: ${APP_VERSION:-0.11.0}
    ports: !override
      - "${FRONTEND_PORT:-80}:3000"
