# docker-compose.prod.yml — Production overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This removes dev volume mounts, uses built images, runs as non-root,
# and serves the frontend via nginx (not Vite dev server).

services:
  postgres:
    ports: !reset []
    # Don't expose Postgres externally in production

  redis:
    ports: !reset []
    # Don't expose Redis externally in production

  backend:
    # Remove dev overrides: no source mount, no reload, run as appuser
    user: appuser
    # 1 worker: 2 workers OOM under real concurrent load (each loads 500 MB CSV
    # + model artifact + stats KDTree, peaks ~3.5 GB under fan-out). Startup
    # cache warmup makes most endpoints hit Redis instead of recomputing, so a
    # single worker handles the dashboard fan-out in <1 s after warmup completes.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    volumes: !override
      - backend-data:/app/data
      - backend-models:/app/models
    ports: !override
      - "${BACKEND_BIND_IP:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    environment:
      APP_ENV: production

  worker:
    user: appuser
    healthcheck:
      disable: true
    volumes: !override
      - backend-data:/app/data
      - backend-models:/app/models
    environment:
      APP_ENV: production

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # No target override — uses full multi-stage (builder → nginx)
    command: !reset []
    volumes: !reset []
    ports: !override
      - "${FRONTEND_PORT:-80}:80"

volumes:
  backend-data:
