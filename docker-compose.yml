services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nepremicnine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-nepremicnine}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nepremicnine}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    image: nepremicnine-v2-backend-dev
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    # Dev overrides: mount source, run as root, enable reload
    user: root
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload",
      ]
    volumes:
      - ./backend:/app
      - backend-data:/app/data
      - backend-models:/app/models
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    # Reuse the backend image instead of building a second identical Python image.
    image: nepremicnine-v2-backend-dev
    pull_policy: never
    restart: unless-stopped
    user: root
    command: ["arq", "app.tasks.training_worker.WorkerSettings"]
    env_file: .env
    healthcheck:
      disable: true
    volumes:
      - ./backend:/app
      - backend-data:/app/data
      - backend-models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    profiles: ["container-frontend"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    command: ["pnpm", "dev", "--host", "0.0.0.0", "--port", "3000"]
    environment:
      BACKEND_URL: http://backend:8000
      APP_VERSION: ${APP_VERSION:-0.11.0}
      NUXT_BUILD_DIR: /tmp/.nuxt-app
      NUXT_OUTPUT_DIR: /tmp/.output
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  backend-data:
  backend-models:
  frontend-node-modules:
